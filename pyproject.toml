[project]
name = "ontogate-rag"
version = "0.2.0"
description = "Selective biomedical RAG: an LLM evidence judge and MeSH/Hetionet ontology coverage decide when to answer and when to abstain on PubMedQA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LLM
    "google-genai>=2.0.0",

    # Ontology
    "rdflib>=7.0.0",

    # Retrieval
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "torch>=2.1.0",
    "transformers>=4.40.0",

    # Data & statistics
    "datasets>=3.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "matplotlib>=3.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
